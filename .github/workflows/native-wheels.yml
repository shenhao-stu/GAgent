name: Android native wheels

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [cffi, bcrypt, pynacl, cryptography, numpy]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: liberica
          java-version: '17.0.21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/cibuildwheel
          key: android-cibw435-toolchain-${{ runner.os }}-cp313
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: wheels
        with:
          path: build/python-wheels
          key: android-cp313-cibw435-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('tools/native-sources.json', 'tools/build_android_wheels.py', '.github/workflows/native-wheels.yml') }}
      - if: steps.wheels.outputs.cache-hit != 'true'
        run: python -m pip install cibuildwheel==4.3.5
      - if: steps.wheels.outputs.cache-hit != 'true'
        run: rustup target add aarch64-linux-android
      - if: steps.wheels.outputs.cache-hit != 'true'
        run: python tools/build_android_wheels.py "${{ matrix.package }}"
      - if: matrix.package == 'numpy' && steps.wheels.outputs.cache-hit != 'true'
        run: python tools/build_android_wheels.py opencv-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-native-${{ matrix.package }}
          path: build/python-wheels/*.whl
          if-no-files-found: error
          retention-days: 7
