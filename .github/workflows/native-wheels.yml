name: Android native wheels

on:
  pull_request:
    paths: ['tools/build_android_wheels.py', 'tools/native-sources.json', '.github/workflows/native-wheels.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [cffi, bcrypt, pynacl, cryptography, numpy, opencv-python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: liberica
          java-version: '17.0.21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: python -m pip install cibuildwheel==4.3.5
      - run: rustup target add aarch64-linux-android
      - run: python tools/build_android_wheels.py "${{ matrix.package }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-native-${{ matrix.package }}
          path: build/python-wheels/*.whl
          if-no-files-found: error
          retention-days: 7
