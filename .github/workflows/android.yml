name: Android

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-test.txt
      - name: Use the runner browser for UI tests
        timeout-minutes: 5
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Source and archive audit
        run: python tools/audit_source.py
      - name: Scan every commit without exposing matches
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Python and WebUI regression tests
        run: |
          python -m pytest -q
          python tools/test_mykey_writer.py
          python tools/test_provider_selection.py
          python tools/test_jev_ui.py
          python tools/test_sess_registry.py
      - name: JavaScript syntax
        run: find app/src/main/assets/gacore/webui -name '*.js' -print0 | xargs -0 -n1 node --check

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '17.0.21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: tsbridge/go.sum
      - name: Android native toolchain
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"
      - name: Build mesh adapter
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: bash tools/build_tsbridge.sh
      - name: Build patched portable HTTP wheels
        run: python tools/build_pure_wheels.py
      - name: Configure optional release signing
        env:
          GAGENT_RELEASE_KEYSTORE: ${{ secrets.GAGENT_RELEASE_KEYSTORE }}
        run: |
          if [ -n "$GAGENT_RELEASE_KEYSTORE" ]; then
            umask 077
            printf '%s' "$GAGENT_RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/gagent.p12"
            printf 'GAGENT_KEYSTORE_PATH=%s/gagent.p12\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi
      - name: Inject optional PC Link bootstrap
        env:
          GAGENT_PCLINK_DEFAULTS: ${{ secrets.GAGENT_PCLINK_DEFAULTS }}
        run: python tools/write_pclink_defaults.py
      - name: Test and build both Android variants
        env:
          GAGENT_STORE_PASSWORD: ${{ secrets.GAGENT_STORE_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Audit APK contents and write checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GAgent-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/GAgent-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/GAgent-release-unsigned.apk
          fi
          for apk in dist/*.apk; do
            python tools/audit_source.py --apk "$apk"
            python tools/apk_inventory.py --verify-runtime "$apk" > "$apk.inventory.json"
            if [[ "$apk" != *-unsigned.apk ]]; then
              "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" >> dist/SIGNATURES.txt
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/gagent.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: GAgent-android-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
