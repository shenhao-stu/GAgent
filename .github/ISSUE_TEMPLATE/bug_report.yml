name: Bug report / 问题报告
description: Reproduce incorrect behavior with minimal, redacted evidence / 提供最小复现与脱敏证据
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, provider files, personal chats or raw production logs.
        For suspected vulnerabilities, follow [SECURITY.md](https://github.com/shenhao-stu/GAgent/blob/main/SECURITY.md).
        请勿附带密钥、完整配置、个人聊天或原始生产日志；漏洞请使用安全报告流程。
  - type: input
    id: build
    attributes:
      label: Version, commit and variant / 版本、提交与类型
      description: Include debug or release and where the APK came from / 说明 debug 或 release 及制品来源
      placeholder: "2.33.3 / 136, commit ..., debug, repository CI artifact"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment / 相关环境
      description: Device/Android/orientation; protocol and model if relevant. No tokens or full config.
      placeholder: |
        Device and Android / 设备与系统:
        Orientation or fold state / 方向或折叠状态:
        Protocol and model, if relevant / 相关协议与模型:
        Permission/proxy state, if relevant / 相关权限与代理状态:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal steps and initial state / 最小步骤与初态
      description: Include a non-sensitive query if relevant. Note warm state and manual assistance.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result / 预期与实际结果
      description: State what the device or tool actually did, not only the model's final answer.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence / 脱敏证据
      description: Short error, exact check result or cropped screenshot. Do not paste a complete runtime directory.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前
      options:
        - label: I removed credentials and personal data from this report. / 已移除秘密和个人数据。
          required: true
