# XcodeGen spec — generate GAgent.xcodeproj with: cd ios && xcodegen generate
# Dependencies fetched on demand by ios/deps/get_python.sh & get_shell.sh (.gitignore excludes Vendor/ and Resources/):
#   ios/Vendor/Python.xcframework        BeeWare Python-Apple-support 3.13
#   ios/Resources/python/                PYTHONHOME (stdlib + lib-dynload)
#   ios/Resources/site-packages/         Pure-Python & iOS wheels (requests, websockets, aiohttp, cryptography, rubicon-objc)
#   ios/Vendor/{ios_system,dash,...}.xcframework + ios/Vendor/shell/   Built-in code_run shell
name: GAgent
options:
  bundleIdPrefix: io.github.shenhaostu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    GAGENT_APP_ID: io.github.shenhaostu.gagent
    MARKETING_VERSION: "0.10"
    CURRENT_PROJECT_VERSION: "20"
targets:
  GAgent:
    type: application
    platform: iOS
    sources:
      - path: ReplayCapture
        excludes: ["*.entitlements"]
      - path: ReplayCaptureHost
      - path: GAgent
      - path: BoardKit
        excludes: ["LICENSE", "NOTICE"]
      - path: BoardKit/LICENSE
        buildPhase: resources
      - path: BoardKit/NOTICE
        buildPhase: resources
      - path: py
        name: py
        type: folder
      - path: Resources/gacore
        name: gacore
        type: folder
        optional: true
      - path: Resources/python
        name: python
        type: folder
        optional: true
      - path: Resources/site-packages
        name: site-packages
        type: folder
        optional: true
      - path: Vendor/shell/commandDictionary.plist
        buildPhase: resources
        optional: true
      - path: Vendor/shell/bin
        name: bin
        type: folder
        optional: true
    dependencies:
      - target: GAgentBroadcast
        embed: true
      - framework: Vendor/Python.xcframework
        embed: true
        codeSign: true
      - {framework: Vendor/ios_system.xcframework, embed: true, codeSign: true, link: false}
      - {framework: Vendor/dash.xcframework, embed: true, codeSign: true, link: false}
      - {framework: Vendor/shell.xcframework, embed: true, codeSign: true, link: false}
      - {framework: Vendor/files.xcframework, embed: true, codeSign: true, link: false}
      - {framework: Vendor/text.xcframework, embed: true, codeSign: true, link: false}
      - {framework: Vendor/awk.xcframework, embed: true, codeSign: true, link: false}
    postBuildScripts:
      - name: Process Python dylibs (PEP 730 .fwork)
        shell: /bin/bash
        script: |
          bash "$SRCROOT/deps/process_dylibs.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GAGENT_APP_ID)"
        GAGENT_APP_ENTITLEMENTS: ReplayCapture/Replay.entitlements
        CODE_SIGN_ENTITLEMENTS: "$(GAGENT_APP_ENTITLEMENTS)"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GAgent/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: GAgent/python_bridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/Python.xcframework/ios-arm64/include/python3.13"
          - "$(SRCROOT)/Vendor/Python.xcframework/ios-arm64/Headers"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS:
          - "-lc++"

  GAgentBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: ReplayCapture
        excludes: ["*.entitlements"]
      - path: BroadcastUpload
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(GAGENT_APP_ID).broadcast"
        INFOPLIST_FILE: BroadcastUpload/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ReplayCapture/Replay.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"

  BoardKitHarness:
    type: framework
    platform: iOS
    sources:
      - path: BoardKit
        excludes: ["LICENSE", "NOTICE", "BoardSession.swift", "App/AutoCalibrator.swift", "App/TouchCalibration.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shenhaostu.gagent.boardkit.testsupport
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

  BoardKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BoardKitTests]
    dependencies:
      - target: BoardKitHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shenhaostu.gagent.boardkit.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  BoardKitTests:
    build:
      targets:
        BoardKitHarness: all
        BoardKitTests: [test]
    test:
      targets: [BoardKitTests]
