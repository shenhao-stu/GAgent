org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# 注: 本地 HTTP 代理请放到 ~/.gradle/gradle.properties (机器私有), 不要提交到仓库。
# 旧版此处写死 127.0.0.1:2082, 会让 CI 与无代理的机器构建失败, 已移除。
# AGP 8.1.4 未声明支持 compileSdk 36; 仅为调用 android.app.appfunctions(API 36) 而升, 关掉告警
android.suppressUnsupportedCompileSdk=36
