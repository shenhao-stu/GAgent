plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}
android {
    namespace 'com.ljq.ga'
    compileSdk 36
    ndkVersion "25.1.8937393"   // AGP 8.1 默认 NDK; CI(setup-android) 缺则 AGP 经 sdkmanager 自动拉取
    defaultConfig {
        applicationId "io.github.shenhaostu.gagent"
        minSdk 24; targetSdk 34; versionCode 141; versionName "2.33.8"
        ndk { abiFilters "arm64-v8a" }
        buildConfigField "String", "CHANNEL", '"opensource"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (System.getenv('GAGENT_KEYSTORE_PATH')) {
            release {
                storeFile file(System.getenv('GAGENT_KEYSTORE_PATH'))
                storePassword System.getenv('GAGENT_STORE_PASSWORD')
                keyAlias 'gagent'
                keyPassword System.getenv('GAGENT_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"; versionNameSuffix "-debug"
            // CI upgrades must retain the installed app's signing identity.
            if (System.getenv('GAGENT_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('GAGENT_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
chaquopy {
    defaultConfig {
        version "3.10"
        def bp = (project.findProperty("chaquopy.python") ?: System.getenv("CHAQUOPY_PYTHON"))?.toString()?.trim()
        if (bp) { buildPython bp }
        // buildPython 默认不写死: Chaquopy 自动探测 PATH 上的 python3.10 (CI/作者Mac/本机一致)。
        // 本地可指定: -Pchaquopy.python=... 或环境变量 CHAQUOPY_PYTHON=...。
        // opencv钉4.5.1.48: chaquo仓库无cp311 opencv轮子,只有cp310; 不钉版本pip会抓PyPI sdist必败
        // Private mesh relay and pinned PC SSH both require these Chaquopy-compatible dependencies.
        pip {
            options '--find-links', rootProject.file('build/python-wheels').absolutePath
            install "requests==2.34.2"; install "certifi==2026.10.19"; install "charset-normalizer==2.1.1"; install "beautifulsoup4==4.15.0"; install "numpy==1.26.2"; install "opencv-python==4.5.1.48"; install "websocket-client==1.9.2"; install "PyYAML==6.0.3"; install "websockets==16.1.1"; install "cryptography==42.0.8"; install "aiohttp==3.14.5"; install "multidict==7.1.0"; install "yarl==1.25.1"; install "frozenlist==1.8.0"; install "propcache==0.5.4"; install "paramiko==2.12.0"; install "bcrypt==3.1.7"; install "pynacl==1.5.0"; install "cffi==1.17.1" }
    }
}
dependencies {
    testImplementation "junit:junit:4.13.2"
    // tsbridge.aar = tsnet(用户态 tailscale) gomobile 产物, 由 tools/build_tsbridge.sh 生成(CI 里在 gradle 前跑)
    implementation files('libs/tsbridge.aar')
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.core:core:1.13.1'           // FileProvider(拍照输出, issue#1)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'       // 定时闹钟后台调度(Doze 友好, 跨重启持久化)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'         // VoiceClient WS(原生TLS指纹)
    // app 内自连无线 ADB(类 LADB 但纯 Kotlin, 无打包 adb 二进制): SPAKE2 配对 + ADB-over-TLS 线协议。
    //  sun-security-android = libadb 依赖的 X509 证书生成(轻量, 不引 BouncyCastle)。Conscrypt 供 TLSv1.3(minSdk24 满足)。
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    // PCLink 扫码配对(与拍照走外置相机、不声明 CAMERA 的路径分开; 扫码需应用内预览→声明 CAMERA + 运行时授权)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Shizuku: 第二条 shell 通道(用户装 Shizuku 管理器授权后即得 shell uid)，供 stepOS 全屏启动用。
    // api = 调用面; provider = ShizukuProvider(ContentProvider)，**管理器靠它发现本 app**——缺了它
    // 管理器「已授权应用」列表里根本看不到 GA(真机实证：只加 api 时列表为空)。
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}


tasks.register('checkPackagedInputs', Exec) {
    workingDir rootProject.projectDir
    commandLine System.getenv('CHAQUOPY_PYTHON') ?: 'python3', 'tools/audit_source.py'
}
tasks.named('preBuild').configure { dependsOn 'checkPackagedInputs' }

def noticesDirectory = layout.buildDirectory.dir('generated/notices')
tasks.register('prepareThirdPartyNotices', Sync) {
    into noticesDirectory
    from(rootProject.file('third_party')) { into 'third_party' }
    from(rootProject.file('build/go-notices')) { into 'third_party/go' }
    from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY.md')) { into 'third_party' }
}
android.sourceSets.main.assets.srcDir(noticesDirectory)
tasks.named('preBuild').configure { dependsOn 'prepareThirdPartyNotices' }

afterEvaluate {
    tasks.matching { it.name ==~ /generate(Debug|Release)Python(Misc|Requirements)Assets/ }.configureEach { task ->
        inputs.file rootProject.file('tools/prepare_python_assets.py')
        inputs.file rootProject.file('app/src/main/assets/gacore/fsbot/deps/site_packages.tgz')
        doLast {
            project.exec { spec ->
                spec.commandLine System.getenv('CHAQUOPY_PYTHON') ?: 'python3',
                    rootProject.file('tools/prepare_python_assets.py'),
                    new File(task.outputDir.get().asFile, 'chaquopy')
            }
        }
    }
}
